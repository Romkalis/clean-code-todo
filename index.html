<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Todo App</title>
		<link
			href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<header class="header">
			<img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix" />
			<a
				class="header__link"
				href="https://goal-life.com/page/method/matrix-eisenhower"
			>
				Want more details?
			</a>
		</header>

		<main class="main">
			<h1 class="visually-hidden">Todo App</h1>

			<section>
				<label for="new-task">Add Item</label>
				<div class="new-task__grid">
					<input id="new-task" class="task" type="text" />
					<button type="button">Add</button>
				</div>
			</section>

			<section>
				<h2>Todo</h2>
				<ul id="incompleteTasks" class="task-list">
					<li>
						<input type="checkbox" />
						<label class="task">Pay Bills</label>
						<input type="text" class="task" />
						<button class="edit" type="button">Edit</button>
						<button class="delete" type="button">
							<img src="./remove.svg" alt="Remove Button" />
						</button>
					</li>
					<li class="editMode">
						<input type="checkbox" />
						<label class="task">Go Shopping</label>
						<input type="text" value="Go Shopping" class="task" />
						<button class="edit" type="button">Save</button>
						<button class="delete" type="button">
							<img src="./remove.svg" alt="Remove Button" />
						</button>
					</li>
				</ul>
			</section>

			<section>
				<h2 id="completed-heading">Completed</h2>
				<ul id="completed-tasks" class="task-list task-list--completed">
					<li>
						<input type="checkbox" checked />
						<label class="task">See the Doctor</label>
						<input type="text" class="task" />
						<button class="edit" type="button">Edit</button>
						<button class="delete" type="button">
							<img src="./remove.svg" alt="Remove Button" />
						</button>
					</li>
				</ul>
			</section>
		</main>

		<script src="app.js"></script>
	</body>
</html>
